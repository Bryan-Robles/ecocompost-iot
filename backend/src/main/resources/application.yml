spring:
  application:
    name: ecocompost-backend
  datasource:
    # H2 en modo archivo (ADR-001): sin instalar base de datos
    url: jdbc:h2:file:./data/ecocompost
    username: sa
    password: ""
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
  h2:
    console:
      enabled: true

server:
  port: 8080

management:
  endpoints:
    web:
      exposure:
        include: health,info
